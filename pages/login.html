<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Almacén Municipal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            corporate: {
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-bg flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Encabezado -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur mb-4">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Sistema Logístico</h1>
      <p class="text-blue-200 text-sm mt-1">Almacén Municipal</p>
    </div>

    <!-- Tarjeta de login -->
    <div class="login-card bg-white rounded-2xl p-8">

      <h2 class="text-xl font-semibold text-slate-800 mb-1">Iniciar sesión</h2>
      <p class="text-sm text-slate-500 mb-6">Ingrese sus credenciales para acceder al sistema.</p>

      <!-- Alerta de error -->
      <div id="login-error" class="alert alert-error hidden mb-4" role="alert"></div>

      <form id="login-form" class="space-y-5" novalidate>

        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" autocomplete="username"
              class="login-input w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm transition"
              placeholder="Ingrese su usuario" required>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" autocomplete="current-password"
              class="login-input w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm transition"
              placeholder="Ingrese su contraseña" required>
          </div>
        </div>

        <button type="submit"
          class="w-full py-2.5 px-4 bg-blue-800 hover:bg-blue-900 text-white font-semibold rounded-lg text-sm transition shadow-lg shadow-blue-900/25">
          Ingresar al sistema
        </button>
      </form>

      <!-- Usuarios de prueba -->
      <div class="mt-6 pt-5 border-t border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">Usuarios de demostración</p>
        <div class="grid grid-cols-1 gap-2 text-xs">
          <div class="flex justify-between bg-slate-50 rounded-lg px-3 py-2">
            <span class="text-slate-600"><span class="font-medium text-slate-800">Administrador</span></span>
            <span class="font-mono text-blue-700">admin / admin123</span>
          </div>
          <div class="flex justify-between bg-slate-50 rounded-lg px-3 py-2">
            <span class="text-slate-600"><span class="font-medium text-slate-800">Gerente</span></span>
            <span class="font-mono text-blue-700">gerente / gerente123</span>
          </div>
          <div class="flex justify-between bg-slate-50 rounded-lg px-3 py-2">
            <span class="text-slate-600"><span class="font-medium text-slate-800">Asistente</span></span>
            <span class="font-mono text-blue-700">asistente / asistente123</span>
          </div>
        </div>
      </div>
    </div>

    <p class="text-center text-blue-200/70 text-xs mt-6">
      Municipalidad — Gestión de Almacén © 2026
    </p>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.initLoginForm();
    });
  </script>
</body>
</html>
